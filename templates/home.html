<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'void-bg': '#0a0a0f',
                        'abyss-card': '#1a1a2e',
                        'electro': '#7b2fbe',
                        'electro-light': '#9d4edd',
                    },
                    fontFamily: {
                        'rajdhani': ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <title>
        Genshin Build Tracker
    </title>
</head>
<body class="text-gray-200 p-5 font-rajdhani font-semibold min-h-screen" style="background: radial-gradient(ellipse at top, #3a0a6e 0%, #0a0a0f 100%);">
    <h1 class="text-4xl font-bold text-white mb-8 tracking-widest text-center">
        Genshin Build Tracker
    </h1>
    <div class="flex justify-center mb-6">
    <form method="POST" action="/characters">
        <input type="text" name="uid" placeholder="Enter UID:" class="text-center placeholder-gray-500 rounded-full bg-gray-900 text-white border-2 border-white px-6 py-2 w-96 outline-none focus:border-white">
    </form>
    </div>
    {% if error %}
        <div class="text-center text-red-400 bg-black/30 border border-red-800 rounded-lg px-6 py-3 mx-auto w-fit mb-4 text-sm">
            {{ error }}
        </div>
    {% endif %}
</body>
</html>
