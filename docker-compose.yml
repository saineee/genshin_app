services:
  web:
    build: .
    ports: ["5000:5000"]
    environment:
    - DATABASE_URL=postgresql://paul:${POSTGRES_PASSWORD}@db:5432/genshindb
    depends_on:
      db:
        condition: service_healthy
  db:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U paul -d genshindb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    image: postgres:15
    environment:
    - POSTGRES_USER=paul
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=genshindb
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: